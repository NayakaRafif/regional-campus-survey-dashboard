                                                                        <div key={i} className="flex items-center justify-between gap-3 p-3 rounded-xl bg-emerald-50/60 border border-emerald-100">
                                                                            <div className="min-w-0">
                                                                                <p className="text-xs font-bold text-slate-800 truncate">{t.teacher}</p>
                                                                                <p className="text-[10px] text-slate-500">
                                                                                    {t.responses} respon &bull; {t.feedbackCount} keluhan/saran
                                                                                </p>
                                                                            </div>
                                                                            <div className="text-right flex-shrink-0">
                                                                                {t.avgScore !== null ? (
                                                                                    <>
                                                                                        <p className={`text-sm font-extrabold ${t.avgScore < config.passGrade ? 'text-red-600' : 'text-emerald-700'}`}>{t.avgScore.toFixed(1)}%</p>
                                                                                        <p className="text-[10px] text-slate-400">rata-rata SME</p>
                                                                                    </>
                                                                                ) : (
                                                                                    <p className="text-[10px] text-slate-400">tanpa skor</p>
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* Hospitality */}
                                                    <div className="bg-white rounded-2xl p-6 shadow-xs border border-slate-200">
                                                        <div className="flex items-start justify-between pb-4 border-b border-slate-100">
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-10 h-10 rounded-xl bg-orange-50 text-bri-orange flex items-center justify-center font-bold text-lg">☕</div>
                                                                <div>
                                                                    <h3 className="font-extrabold text-base text-slate-900">Hospitality Experience</h3>
                                                                    <p className="text-xs text-slate-500">Entry Gate (3S), Catering & Facilities</p>
                                                                </div>
                                                            </div>
                                                            <CircleProgress value={analytics.hospitalityScore} size={64} strokeWidth={7} color="#F37021" />
                                                        </div>
                                                        <div className="mt-5 space-y-1">
                                                            <ScoreBar label="Entry Gate (Standar Layanan 3S, Check-in, Petunjuk)" score={analytics.hospitalitySub.gate} passGrade={config.passGrade} color="#F37021" />
                                                            <ScoreBar label="Catering (Kebersihan, Rasa, Variasi, Coffee Break)" score={analytics.hospitalitySub.catering} passGrade={config.passGrade} color="#F37021" />
                                                            <ScoreBar label="Campus Facilities (Kualitas & Kelengkapan)" score={analytics.hospitalitySub.facilities} passGrade={config.passGrade} color="#F37021" />
                                                        </div>
                                                    </div>

                                                    {/* Environment */}
                                                    <div className="bg-white rounded-2xl p-6 shadow-xs border border-slate-200">
                                                        <div className="flex items-start justify-between pb-4 border-b border-slate-100">
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold text-lg">🌳</div>
                                                                <div>
                                                                    <h3 className="font-extrabold text-base text-slate-900">Environment Experience</h3>
                                                                    <p className="text-xs text-slate-500">Lingkungan Kampus, Digital (Brismart/Wi-Fi) & NPS</p>
                                                                </div>
                                                            </div>
                                                            <CircleProgress value={analytics.environmentScore} size={64} strokeWidth={7} color="#8B5CF6" />
                                                        </div>
                                                        <div className="mt-5 space-y-1">
                                                            <ScoreBar label="Lingkungan Campus (Kebersihan, Taman, Signage)" score={analytics.environmentSub.lingkungan} passGrade={config.passGrade} color="#8B5CF6" />
                                                            <ScoreBar label="Akses Digital (Info Pelatihan, Brismart, Wi-Fi)" score={analytics.environmentSub.digital} passGrade={config.passGrade} color="#8B5CF6" />
                                                            <ScoreBar label="Net Promoter Score (Rekomendasi Rekan Kerja)" score={analytics.environmentSub.nps} passGrade={config.passGrade} color="#8B5CF6" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* TAB: RANKING */}
                                        {(activeTab === 'ranking' || activeTab === 'overview') && (
                                            <div className="bg-white rounded-2xl p-6 shadow-xs border border-slate-200">
                                                <div className="flex flex-wrap items-center justify-between mb-5 gap-2">
                                                    <div>
                                                        <h3 className="font-extrabold text-base text-slate-900">Peringkat Kepuasan Seluruh Item Survei</h3>
                                                        <p className="text-xs text-slate-500">Diurutkan dari skor tertinggi hingga terendah</p>
                                                    </div>
                                                </div>
                                                <div className="space-y-2.5 max-h-[480px] overflow-y-auto pr-2 custom-scrollbar">
                                                    {analytics.sortedItems.map((item, idx) => (
                                                        <div key={item.id} className="flex items-center gap-3 text-xs">
                                                            <span className="w-6 text-right font-bold text-slate-400 text-[11px]">#{idx + 1}</span>
                                                            <div className="flex-grow">
                                                                <div className="flex justify-between items-center mb-1">
                                                                    <span className="font-semibold text-slate-700 truncate max-w-lg" title={item.fullQuestion}>
                                                                        {item.label} <span className="text-[10px] text-slate-400 font-normal">({item.subcategory})</span>
                                                                    </span>
                                                                    <span className={`font-bold ml-2 ${item.isPass ? 'text-slate-800' : 'text-red-600'}`}>
                                                                        {item.score.toFixed(1)}%
                                                                    </span>
                                                                </div>
                                                                <div className="relative w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                                                    <div
                                                                        className="h-full rounded-full transition-all duration-500"
                                                                        style={{
                                                                            width: `${item.score}%`,
                                                                            backgroundColor: item.isPass ? '#00529C' : '#EF4444'
                                                                        }}
                                                                    />
                                                                    <div className="absolute top-0 bottom-0 w-0.5 bg-slate-400 z-10" style={{ left: `${config.passGrade}%` }} />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* TAB: FEEDBACK */}
                                        {activeTab === 'feedback' && (
                                            <div className="bg-white rounded-2xl p-6 shadow-xs border border-slate-200">
                                                <div className="flex flex-wrap items-center justify-between mb-5 gap-3">
                                                    <div>
                                                        <h3 className="font-extrabold text-base text-slate-900">Saran & Masukan Real Peserta</h3>
                                                        <p className="text-xs text-slate-500">Tercatat {filteredFeedbacks.length} saran dari responden yang Anda upload</p>
                                                    </div>
                                                    <div className="flex flex-wrap items-center gap-2">
                                                        <input
                                                            type="text"
                                                            placeholder="Cari saran..."
                                                            value={feedbackSearch}
                                                            onChange={e => setFeedbackSearch(e.target.value)}
                                                            className="text-xs bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-bri-blue outline-none"
                                                        />
                                                        <select
                                                            value={feedbackCategoryFilter}
                                                            onChange={e => setFeedbackCategoryFilter(e.target.value)}
                                                            className="text-xs font-semibold bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-bri-blue outline-none"
                                                        >
                                                            <option value="All">Semua Kategori</option>
                                                            <option value="Living">Living Experience</option>
                                                            <option value="Learning">Learning Experience</option>
                                                            <option value="Hospitality">Hospitality Experience</option>
                                                            <option value="Environment">Environment Experience</option>
                                                            <option value="NPS">NPS & Rekomendasi</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                {filteredFeedbacks.length === 0 ? (
                                                    <div className="p-8 text-center text-slate-400 text-sm">
                                                        Tidak ada saran teks yang tercatat dalam data ini.
                                                    </div>
                                                ) : (() => {
                                                    const totalFb = filteredFeedbacks.length;
                                                    const totalFbPages = Math.max(1, Math.ceil(totalFb / fbPageSize));
                                                    const curFbPage = Math.min(fbPage, totalFbPages);
                                                    const pagedFb = filteredFeedbacks.slice((curFbPage - 1) * fbPageSize, curFbPage * fbPageSize);
                                                    return (
                                                        <>
                                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[460px] overflow-y-auto pr-2 custom-scrollbar">
                                                                {pagedFb.map((fb, i) => (
                                                                    <div key={i} className="bg-slate-50 hover:bg-slate-100 p-4 rounded-xl border border-slate-200 transition-colors flex flex-col justify-between">
                                                                        <div>
                                                                            <div className="flex justify-between items-center mb-2">
                                                                                <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-blue-100 text-bri-blue">
                                                                                    {fb.category} &bull; {fb.subTitle}
                                                                                </span>
                                                                                <span className="text-[10px] text-slate-400">{fb.timestamp}</span>
                                                                            </div>
                                                                            <p className="text-xs text-slate-700 italic font-medium leading-relaxed">
                                                                                "{fb.text}"
                                                                            </p>
                                                                        </div>
                                                                        <div className="mt-3 pt-2 border-t border-slate-200 flex justify-between items-center text-[10px] text-slate-400">
                                                                            <span className="truncate max-w-[140px] font-semibold text-slate-600">{fb.program}</span>
                                                                            <span>{fb.responseId}</span>
                                                                        </div>
                                                                        {fb.teacher ? (
                                                                            <div className="mt-1.5 flex items-center gap-1.5">
                                                                                <span className="text-[10px] text-slate-400">Pengajar:</span>
                                                                                <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 truncate max-w-[200px]">{fb.teacher}</span>
                                                                            </div>
                                                                        ) : null}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                            <div className="mt-4 pt-3 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                                                                <div className="flex items-center gap-2 text-xs">
                                                                    <span className="text-slate-500">Menampilkan {(curFbPage - 1) * fbPageSize + 1}–{Math.min(curFbPage * fbPageSize, totalFb)} dari {totalFb} saran</span>
                                                                    <select
                                                                        value={fbPageSize}
                                                                        onChange={e => { setFbPageSize(Number(e.target.value)); setFbPage(1); }}
                                                                        className="text-xs bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 focus:ring-2 focus:ring-bri-blue outline-none"
                                                                    >
                                                                        <option value={100}>100/ halaman</option>
                                                                        <option value={200}>200/ halaman</option>
                                                                        <option value={500}>500/ halaman</option>
                                                                    </select>
                                                                </div>
                                                                <div className="flex items-center gap-1">
                                                                    <button onClick={() => setFbPage(curFbPage - 1)} disabled={curFbPage <= 1} className="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed">&lsaquo;</button>
                                                                    <span className="px-2 text-xs text-slate-600 font-semibold">Hal {curFbPage} / {totalFbPages}</span>
                                                                    <button onClick={() => setFbPage(curFbPage + 1)} disabled={curFbPage >= totalFbPages} className="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed">&rsaquo;</button>
                                                                </div>
                                                            </div>
                                                        </>
                                                    );
                                                })()}
                                            </div>
                                        )}

                                        {/* TAB: RAW DATA TABLE */}
                                        {activeTab === 'raw' && (
                                            <div className="bg-white rounded-2xl p-6 shadow-xs border border-slate-200">
                                                <div className="flex justify-between items-center mb-4">
                                                    <div>
                                                        <h3 className="font-extrabold text-base text-slate-900">Data Responden yang Tersimpan</h3>
                                                        <p className="text-xs text-slate-500">Daftar seluruh baris respon yang telah Anda upload ke dashboard</p>
                                                    </div>
                                                    <button
                                                        onClick={handleExportExcel}
                                                        className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-colors"
                                                    >
                                                        Download Excel (.xlsx)
                                                    </button>
                                                </div>

                                                <div className="overflow-x-auto max-h-[460px] custom-scrollbar border border-slate-200 rounded-xl">
                                                    <table className="w-full text-xs text-left text-slate-700">
                                                        <thead className="bg-slate-100 text-slate-700 font-bold sticky top-0 uppercase text-[10px]">
                                                            <tr>
                                                                <th className="p-3 border-b">No</th>
                                                                <th className="p-3 border-b">ID Respon</th>
                                                                <th className="p-3 border-b">Tanggal</th>
                                                                <th className="p-3 border-b">Living (%)</th>
                                                                <th className="p-3 border-b">Ruang Kelas (%)</th>
                                                                <th className="p-3 border-b">Materi (%)</th>
                                                                <th className="p-3 border-b">SME (%)</th>
                                                                <th className="p-3 border-b">Pengajar / SME</th>
                                                                <th className="p-3 border-b">Catering (%)</th>
                                                                <th className="p-3 border-b">NPS</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-100">
                                                            {(() => {
                                                                const totalRawPages = Math.max(1, Math.ceil(surveyData.length / rawPageSize));
                                                                const curRawPage = Math.min(rawPage, totalRawPages);
                                                                const start = (curRawPage - 1) * rawPageSize;
                                                                const pagedRaw = surveyData.slice(start, start + rawPageSize);
                                                                return pagedRaw.map((row, idx) => (
                                                                    <tr key={idx} className="hover:bg-slate-50">
                                                                        <td className="p-3 text-slate-400 font-bold">{start + idx + 1}</td>
                                                                        <td className="p-3 font-mono font-medium text-bri-blue">{row.responseId}</td>
                                                                        <td className="p-3">{row.timestamp}</td>
                                                                        <td className="p-3 font-bold">{row.liv_kamar !== null ? `${row.liv_kamar}%` : '-'}</td>
                                                                        <td className="p-3 font-bold">{row.learn_rk_kebersihan !== null ? `${row.learn_rk_kebersihan}%` : '-'}</td>
                                                                        <td className="p-3 font-bold">{row.learn_mat_update !== null ? `${row.learn_mat_update}%` : '-'}</td>
                                                                        <td className="p-3 font-bold">{row.learn_sme_materi !== null ? `${row.learn_sme_materi}%` : '-'}</td>
                                                                        <td className="p-3 font-semibold text-emerald-700">{row.sme_name || '-'}</td>
                                                                        <td className="p-3 font-bold">{row.hosp_cat_rasa !== null ? `${row.hosp_cat_rasa}%` : '-'}</td>
                                                                        <td className="p-3 font-bold text-purple-700">{row.nps_raw_value !== undefined ? row.nps_raw_value : (row.env_nps_score ? row.env_nps_score / 10 : '-')}</td>
                                                                    </tr>
                                                                ));
                                                            })()}
                                                        </tbody>
                                                    </table>
                                                </div>

                                                <div className="mt-4 pt-3 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                                                    <div className="flex items-center gap-2 text-xs">
                                                        <span className="text-slate-500">Menampilkan {surveyData.length === 0 ? 0 : (Math.min(rawPage, Math.max(1, Math.ceil(surveyData.length / rawPageSize))) - 1) * rawPageSize + 1}–{Math.min((Math.min(rawPage, Math.max(1, Math.ceil(surveyData.length / rawPageSize)))) * rawPageSize, surveyData.length)} dari {surveyData.length} baris</span>
                                                        <select
                                                            value={rawPageSize}
                                                            onChange={e => { setRawPageSize(Number(e.target.value)); setRawPage(1); }}
                                                            className="text-xs bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 focus:ring-2 focus:ring-bri-blue outline-none"
                                                        >
                                                            <option value={100}>100/ halaman</option>
                                                            <option value={200}>200/ halaman</option>
                                                            <option value={500}>500/ halaman</option>
                                                            <option value={1000}>1000/ halaman</option>
                                                        </select>
                                                    </div>
                                                    <div className="flex items-center gap-1">
                                                        <button onClick={() => setRawPage(Math.max(1, (Math.min(rawPage, Math.max(1, Math.ceil(surveyData.length / rawPageSize)))) - 1))} disabled={surveyData.length === 0 || (Math.min(rawPage, Math.max(1, Math.ceil(surveyData.length / rawPageSize))) <= 1)} className="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed">&lsaquo;</button>
                                                        <span className="px-2 text-xs text-slate-600 font-semibold">Hal {surveyData.length === 0 ? 1 : Math.min(rawPage, Math.max(1, Math.ceil(surveyData.length / rawPageSize)))} / {Math.max(1, Math.ceil(surveyData.length / rawPageSize))}</span>
                                                        <button onClick={() => setRawPage(Math.min((Math.min(rawPage, Math.max(1, Math.ceil(surveyData.length / rawPageSize)))) + 1, Math.max(1, Math.ceil(surveyData.length / rawPageSize))))} disabled={surveyData.length === 0 || (Math.min(rawPage, Math.max(1, Math.ceil(surveyData.length / rawPageSize))) >= Math.max(1, Math.ceil(surveyData.length / rawPageSize)))} className="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed">&rsaquo;</button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}
                            </main>
                        </>
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-5 text-center text-xs text-slate-500 no-print mt-auto">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
                            <span>&copy; 2026 <strong>PT. Bank Rakyat Indonesia (Persero) Tbk</strong> &bull; Regional Campus Surveyor</span>
                            <span>Aplikasi Dashboard Hasil Survei Real-Time</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
