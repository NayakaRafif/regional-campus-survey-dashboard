        // --- NORMALIZATION HELPER ---
        const normalizeScore = (val) => {
            if (val === undefined || val === null || val === '') return null;
            const num = parseFloat(val);
            if (isNaN(num)) return null;
            if (num === 11) return 100; // Typeform 11-step scale mapping to 10/10
            if (num <= 5) return (num / 5) * 100;
            if (num <= 10) return (num / 10) * 100;
            return Math.min(100, Math.max(0, num));
        };

        // --- BLANK RESPONSE BUILDER (all fields null/default for unknown schemas) ---
        const buildBlankResponse = () => ({
            responseId:'', timestamp:'', campus:'Regional Campus', program:'Peserta Pelatihan', batch:'-', sme_name:'',
            liv_kamar:null, liv_kamar_mandi:null, liv_ketenangan:null, liv_housekeeping:null, feedback_living:'',
            learn_rk_kebersihan:null, learn_rk_kenyamanan:null, learn_rk_pencahayaan:null, learn_rk_lcd:null, learn_rk_audio:null, learn_rk_internet:null, feedback_ruang_kelas:'',
            learn_mat_update:null, learn_mat_kebutuhan:null, learn_mat_paham:null, learn_mat_studi_kasus:null, feedback_materi:'',
            learn_met_interaktif:null, learn_met_diskusi:null, learn_met_waktu:null, learn_met_menarik:null, feedback_metode:'',
            learn_sme_materi:null, learn_sme_menjelaskan:null, learn_sme_mengelola:null, learn_sme_profesional:null, learn_sme_contoh:null, feedback_sme:'',
            hosp_gate_standar:null, hosp_gate_checkin:null, hosp_gate_petunjuk:null, feedback_entry_gate:'',
            hosp_cat_kebersihan:null, hosp_cat_ramah:null, hosp_cat_variasi:null, hosp_cat_rasa:null, hosp_cat_kualitas:null, hosp_cat_waktu:null, hosp_cat_porsi:null, feedback_catering:'',
            hosp_fac_kualitas:null, feedback_facilities:'',
            env_lingk_kebersihan:null, env_lingk_signage:null, env_lingk_terang:null, feedback_lingkungan:'',
            env_dig_info:null, env_dig_brismart:null, env_dig_wifi:null, feedback_digital:'',
            env_nps_score:null, nps_raw_value:10, feedback_nps:''
        });

        // --- FORMAT DETECTION: checks CSV headers to determine if combined or per-category ---
        const detectCSVFormat = (csvText) => {
            const firstLine = (csvText || '').split('\n')[0] || '';
            const headers = (Papa.parse(firstLine, { header: false }).data[0] || []).map(h => (h || '').toLowerCase().trim());
            const isCombined = headers.some(h => h.includes('kelengkapan fasilitas dan kebersihan kamar'))
                && headers.some(h => h.includes('kebersihan dan kelengkapan kamar mandi'));
            return isCombined ? 'combined' : 'category';
        };

        // --- TEXT TO SCORE: derive numeric scores from qualitative answers ---
        const mapTextToScore = (text) => {
            if (!text || !text.trim()) return null;
            const t = text.toLowerCase().trim();
            // Excellent signals
            if (t.includes('sangat membantu') || t.includes('sangat baik') || t.includes('sangat paham') || t.includes('sangat mudah') || t.includes('sangat di pahami')) return 95;
            if (t.includes('sudah paham dan bisa menerapkan') || t.includes('bisa menerapkan')) return 90;
            if (t.includes('ya, sangat membantu')) return 92;
            if (t.includes('sudah bagus') || t.includes('sudah baik') || t.includes('sudah oke') || t.includes('sudah good') || t.includes('sudah sesuai')) return 85;
            if (t.includes('mudah di mengerti') || t.includes('mudah dipahami') || t.includes('mudah di pahami')) return 88;
            if (t.includes('penjelasan sangat rinci') || t.includes('pemaparan materi') || t.includes('pembawaan materi')) return 90;
            if (t.includes('sangat bermanfaat') || t.includes('sangat menarik') || t.includes('menyenangkan')) return 92;
            if (t.includes('sangat baik') || t.includes('sangat sesuai')) return 93;
            // Good signals
            if (t.includes('sudah paham')) return 80;
            if (t.includes('komunikasi dua arah') || t.includes('interaktif')) return 82;
            if (t.includes('sharing') || t.includes('diskusi')) return 78;
            if (t.includes('ok') || t.includes('oke') || t.includes('so gaga')) return 75;
            // Medium signals
            if (t.includes('paham sebagian')) return 60;
            if (t.includes('belum sepenuhnya paham')) return 50;
            if (t.includes('belum sepenuhnya terjawab')) return 65;
            if (t.includes('sudah paham, namun belum dapat menerapkan')) return 55;
            if (t.includes('perlu penjelasan lebih lanjut')) return 45;
            // Low signals
            if (t.includes('belum bisa') || t.includes('tidak paham') || t.includes('kurang')) return 30;
            // Default: any non-empty text means participant engaged → moderate score
            if (text.trim().length > 0) return 72;
            return null;
        };

        // --- TEACHING METHODS: count how many methods used → derive scores ---
        const countTeachingMethods = (row) => {
            let count = 0;
            for (let i = 7; i <= 17; i++) {
                if (row[i] && String(row[i]).trim()) count++;
            }
            return count;
        };
        const teachingMethodScore = (count) => {
            if (count === 0) return 55;
            if (count <= 2) return 65;
            if (count <= 4) return 78;
            if (count <= 6) return 85;
            if (count <= 8) return 90;
            return 95;
        };
        const hasMethod = (row, colIdx) => row[colIdx] && String(row[colIdx]).trim() ? true : false;

        // --- UNIVERSAL PER-CATEGORY PARSER (auto-detects category from headers) ---
        const parseCategoryCSV = (csvText) => {
            return new Promise((resolve, reject) => {
                Papa.parse(csvText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: (results) => {
                        const data = results.data;
                        if (!data || data.length < 2) {
                            reject(new Error("File CSV tidak memiliki baris data yang cukup."));
                            return;
                        }
                        const hl = data[0].map(h => (h || '').trim().toLowerCase());
                        const rows = data.slice(1);

                        // === PRE-CACHE: resolve ALL column indices ONCE (not per row) ===
                        const findColIdx = (patterns) => {
                            for (const p of patterns) {
                                const pl = p.toLowerCase();
                                if (!pl) continue;
                                for (let i = 0; i < hl.length; i++) {
                                    if (hl[i].includes(pl)) return i;
                                }
                            }
                            return -1;
                        };

                        // Category detection
                        const isLearning = hl.some(h => h.includes('lecturing') || h.includes('ceramah') || h.includes('pengajar'));
                        const isLiving = hl.some(h => (h.includes('kamar') && (h.includes('bersih') || h.includes('nyaman'))) || h.includes('housekeeping') || h.includes('laundry') || h.includes('asrama') || h.includes('menginap'));
                        const isHospitality = hl.some(h => h.includes('catering') || h.includes('restoran') || (h.includes('makanan') && !h.includes('menginap')) || h.includes('check-in'));
                        const isEnvironment = hl.some(h => h.includes('brismart') || h.includes('lingkungan campus') || h.includes('signage'));
                        const isNPS = hl.some(h => h.includes('rekomendasikan') || h.includes('net promoter'));

                        // Cache metadata column indices
                        const colId = findColIdx(['#', 'response id', 'id']);
                        const colCampus = findColIdx(['regional campus', 'campus', 'lokasi', 'nama kampus', 'lokasi tempat menginap', 'nama catering']);
                        const colProgram = findColIdx(['nama program', 'program', 'pelatihan', 'nama pelatihan']);
                        const colBatch = findColIdx(['nomor batch', 'batch', 'gelombang']);
                        const colTimestamp = findColIdx(['submit date', 'start date', 'tanggal submit', 'tanggal']);
                        const colNps = findColIdx(['seberapa besar kemungkinan', 'rekomendasikan', 'nps']);
                        const colFbGood = findColIdx(['sudah baik', 'perlu dipertahankan', 'yang sudah baik']);
                        const colFbImprove = findColIdx(['perlu ditingkatkan', 'perlu diperbaikan', 'yang perlu ditingkatkan']);
                        const colRateQa = findColIdx(['peserta bertanya', 'menjawab dengan relevan', 'menjawab']);
                        const colRateApply = findColIdx(['menerapkan materi', 'sejauh mana', 'dapat menerapkan']);
                        const colSaran = findColIdx(['saran dan masukan', 'saran untuk', 'masukan']);
                        const colAlasan = findColIdx(['alasan utama', 'alasan memberikan', 'alasan']);
                        const colCeritakan = findColIdx(['ceritakan pengalaman', 'ceritakan']);

                        // Cache teacher (SME) name column indices. Values come from a
                        // Typeform dropdown, so any teacher added by admin flows in freely.
                        const colSme1 = findColIdx(['data pengajar / sme 1', 'data pengajar', 'pengajar / sme 1', 'nama pengajar 1', 'sme 1']);
                        const colSme2 = findColIdx(['data pengajar / sme 2', 'sme 2', 'pengajar / sme 2', 'nama pengajar 2']);
                        const colSmeExt = findColIdx(['pengajar eksternal', 'nama pengajar eksternal', 'eksternal']);

                        // Cache teaching method column indices
                        const methodColMap = {};
                        [['lecturing','ceramah','lecturing'],['tanya jawab','','tanya_jawab'],['diskusi kelompok','','diskusi'],
                         ['demonstrasi','hands on','demo'],['praktik langsung','','praktik'],['presentasi','','presentasi'],
                         ['role play','','roleplay'],['case study','','casestudy'],['video learning','','video'],
                         ['sharing session','','sharing'],['peer learning','','peer']].forEach(([a,b,key]) => {
                            const patterns = b ? [a, b] : [a];
                            const idx = findColIdx(patterns);
                            if (idx !== -1) methodColMap[key] = idx;
                        });

                        // Cache score column indices
                        const scoreIdxMap = {};
                        const scoreDefs = [
                            ['kebersihan kamar','fasilitas kamar','kenyamanan kamar','liv_kamar'],
                            ['kamar mandi','kebersihan kamar mandi','liv_kamar_mandi'],
                            ['ketenangan','keamanan asrama','keamanan hotel','keramahan petugas hotel','keramahan petugas (resepsionis','liv_ketenangan'],
                            ['housekeeping','laundry','liv_housekeeping'],
                            ['kebersihan ruang kelas','fasilitas ruang kelas','learn_rk_kebersihan'],['kenyamanan ruang kelas','','learn_rk_kenyamanan'],
                            ['pencahayaan ruang','penerangan ruang','learn_rk_pencahayaan'],['lcd','projector','learn_rk_lcd'],
                            ['audio ruang','kualitas audio','learn_rk_audio'],['internet di kelas','wifi di kelas','koneksi internet','learn_rk_internet'],
                            ['materi update','materi sesuai ketentuan','learn_mat_update'],['materi sesuai kebutuhan','kebutuhan kerja','learn_mat_kebutuhan'],
                            ['materi mudah dipahami','mudah dipahami','learn_mat_paham'],['studi kasus','','learn_mat_studi_kasus'],
                            ['pembelajaran interaktif','interaktif','learn_met_interaktif'],['diskusi efektif','simulasi','learn_met_diskusi'],
                            ['waktu belajar','','learn_met_waktu'],['pelatihan menarik','tidak membosankan','learn_met_menarik'],
                            ['penguasaan materi','','learn_sme_materi'],['menjelaskan dan menjawab','kemampuan menjelaskan','learn_sme_menjelaskan'],
                            ['mengelola kelas','','learn_sme_mengelola'],['profesionalisme','ketepatan waktu','learn_sme_profesional'],

        // --- SMART CSV / SPREADSHEET PARSER (auto-detects format) ---
        const parseSurveyCSV = (csvText) => {

            // === COMBINED FORMAT (original positional + pattern logic) ===
            return new Promise((resolve, reject) => {
                Papa.parse(csvText, {

                        const headers = data[0].map(h => (h || '').trim());
                        const rows = data.slice(1);

                        const findColIdx = (patterns) => {
                            for (const pattern of patterns) {

                                if (!pLower) continue;
                                const idx = headers.findIndex(h => h.toLowerCase().includes(pLower));
                                if (idx !== -1) return idx;

                                        return (val !== undefined && val !== null) ? String(val).trim() : '';
                                    }

                                        return (val !== undefined && val !== null) ? String(val).trim() : '';
                                    }
                                }

                                const idx = findColIdx(patterns);

        // --- STATS COMPUTATION HOOK ---
        const useSurveyAnalytics = (data, filters, passGrade) => {
            return useMemo(() => {
                if (!data || data.length === 0) return null;

                let filtered = data;
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                if (filters.campus !== 'All' || filters.program !== 'All' || filters.batch !== 'All' || filters.dateRange !== 'All') {
                    const past7 = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    const past30 = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                    filtered = data.filter(item => {
                        if (filters.campus !== 'All' && item.campus !== filters.campus) return false;
                        if (filters.program !== 'All' && item.program !== filters.program) return false;
                        if (filters.batch !== 'All' && item.batch !== filters.batch) return false;
                        if (filters.dateRange !== 'All') {
                            if (filters.dateRange === 'Today' && item.timestamp !== todayStr) return false;
                            if (filters.dateRange === '7Days' && new Date(item.timestamp) < past7) return false;
                            if (filters.dateRange === '30Days' && new Date(item.timestamp) < past30) return false;
                            if (filters.dateRange === 'ThisMonth') {

                const allScoreKeys = [];

                const feedbacks = [];

                for (let i = 0; i < filtered.length; i++) {
                    const row = filtered[i];
                    // Accumulate scores
                    for (let j = 0; j < allScoreKeys.length; j++) {
                        const k = allScoreKeys[j].id;
                        const v = row[k];
                        if (typeof v === 'number' && !isNaN(v)) {
                            keySums[k] += v;
                            keyCounts[k]++;
                        }
                    }
                    // NPS
                    const rawVal = row.nps_raw_value !== undefined ? row.nps_raw_value : (row.env_nps_score ? row.env_nps_score / 10 : 10);
                    if (rawVal >= 9) promoters++;
                    else if (rawVal >= 7) passives++;
                    else detractors++;
                    // Today count
                    if (row.timestamp === todayStr) todayCount++;
                    // Feedbacks
                    for (let f = 0; f < feedbackFields.length; f++) {
                        const fb = feedbackFields[f];
                        const txt = row[fb.key];
                        if (txt && typeof txt === 'string' && txt.trim().length > 0) {

                                responseId: row.responseId, timestamp: row.timestamp,
                                campus: row.campus, program: row.program, batch: row.batch, teacher: row.sme_name || '',
                                category: fb.category, subTitle: fb.title, text: txt.trim()
                            });

                const calcAvgFromCache = (keys) => {

                    allItemsList.push({
                        id: sk.id, pillar: pillarMap[pId] || 'Other',

                        label: sk.label, fullQuestion: sk.fullQuestion,
                        score, isPass: score >= passGrade

                });

                const livingScore = calcAvgFromCache(SURVEY_SCHEMA.living.items.map(i => i.id));
                const learningRuangScore = calcAvgFromCache(SURVEY_SCHEMA.learning.subcategories[0].items.map(i => i.id));
                const learningMateriScore = calcAvgFromCache(SURVEY_SCHEMA.learning.subcategories[1].items.map(i => i.id));
                const learningMetodeScore = calcAvgFromCache(SURVEY_SCHEMA.learning.subcategories[2].items.map(i => i.id));
                const learningSmeScore = calcAvgFromCache(SURVEY_SCHEMA.learning.subcategories[3].items.map(i => i.id));
                const learningScore = (learningRuangScore + learningMateriScore + learningMetodeScore + learningSmeScore) / 4;
                const hospitalityGateScore = calcAvgFromCache(SURVEY_SCHEMA.hospitality.subcategories[0].items.map(i => i.id));
                const hospitalityCateringScore = calcAvgFromCache(SURVEY_SCHEMA.hospitality.subcategories[1].items.map(i => i.id));
                const hospitalityFacScore = calcAvgFromCache(SURVEY_SCHEMA.hospitality.subcategories[2].items.map(i => i.id));
                const hospitalityScore = (hospitalityGateScore + hospitalityCateringScore + hospitalityFacScore) / 3;
                const envLingkunganScore = calcAvgFromCache(SURVEY_SCHEMA.environment.subcategories[0].items.map(i => i.id));
                const envDigitalScore = calcAvgFromCache(SURVEY_SCHEMA.environment.subcategories[1].items.map(i => i.id));
                const envNpsScore = calcAvgFromCache(SURVEY_SCHEMA.environment.subcategories[2].items.map(i => i.id));
                const environmentScore = (envLingkunganScore + envDigitalScore + envNpsScore) / 3;
                const overallScore = (livingScore + learningScore + hospitalityScore + environmentScore) / 4;

                const totalNpsRespondents = promoters + passives + detractors || 1;
                const pctPromoters = (promoters / totalNpsRespondents) * 100;
                const pctPassives = (passives / totalNpsRespondents) * 100;
                const pctDetractors = (detractors / totalNpsRespondents) * 100;
                const npsIndex = Math.round(pctPromoters - pctDetractors);

                const sortedItems = [...allItemsList].sort((a, b) => b.score - a.score);
                const topStrengths = sortedItems.slice(0, 4);
                const areasToImprove = sortedItems.filter(i => i.score < passGrade).sort((a, b) => a.score - b.score);

                // Per-teacher (SME) summary: avg SME score + complaint count.
                // Grouped by sme_name (arbitrary strings from the form dropdown => flexible).
                const smeKeys = ['learn_sme_materi','learn_sme_menjelaskan','learn_sme_mengelola','learn_sme_profesional','learn_sme_contoh'];
                const teacherMap = new Map();
                filtered.forEach(row => {
                    const names = (row.sme_name || '').split(' + ').map(s => s.trim()).filter(Boolean);
                    const scoreVals = smeKeys.map(k => row[k]).filter(v => typeof v === 'number' && !isNaN(v));
                    const avg = scoreVals.length ? scoreVals.reduce((a, b) => a + b, 0) / scoreVals.length : null;
                    const complaintCount = feedbackFields
                        .filter(fb => fb.key === 'feedback_sme' || fb.key === 'feedback_metode' || fb.key === 'feedback_materi')
                        .reduce((acc, fb) => acc + ((row[fb.key] && typeof row[fb.key] === 'string' && row[fb.key].trim().length > 0) ? 1 : 0), 0);
                    const nameCount = names.length || 1;
                    names.forEach(name => {
                        const display = name || '(tanpa nama)';
                        if (!teacherMap.has(display)) teacherMap.set(display, { teacher: display, responses: 0, scoreSum: 0, scoreCount: 0, feedbackCount: 0 });
                        const t = teacherMap.get(display);
                        t.responses += 1 / nameCount;
                        if (avg !== null) { t.scoreSum += avg; t.scoreCount++; }
                        t.feedbackCount += complaintCount / nameCount;
                    });
                });
                const teacherSummary = [...teacherMap.values()]
                    .map(t => ({ ...t, avgScore: t.scoreCount ? t.scoreSum / t.scoreCount : null, responses: Math.round(t.responses) }))
                    .filter(t => t.teacher !== '(tanpa nama)')
                    .sort((a, b) => (b.feedbackCount - a.feedbackCount) || ((b.avgScore || 0) - (a.avgScore || 0)));

                return {
                    totalResponses: filtered.length,
                    todayCount,
                    overallScore,
                    livingScore,
                    learningScore,
                    hospitalityScore,
                    environmentScore,
                    teacherSummary,
                    learningSub: {
                        ruang: learningRuangScore,
                        materi: learningMateriScore,
                        metode: learningMetodeScore,
                        sme: learningSmeScore
                    },
                    hospitalitySub: {
                        gate: hospitalityGateScore,
                        catering: hospitalityCateringScore,
                        facilities: hospitalityFacScore
                    },
                    environmentSub: {
                        lingkungan: envLingkunganScore,
                        digital: envDigitalScore,
                        nps: envNpsScore
                    },
                    nps: {
                        score: npsIndex,
                        promoters: pctPromoters,
                        passives: pctPassives,
                        detractors: pctDetractors,
                        counts: { promoters, passives, detractors, total: totalNpsRespondents }
                    },
                    itemScores,
                    allItemsList,
                    sortedItems,
                    topStrengths,
                    areasToImprove,
                    feedbacks
                };
            }, [data, filters, passGrade]);
        };

        // --- CIRCLE PROGRESS COMPONENT ---
        const CircleProgress = ({ value = 0, size = 90, strokeWidth = 8, color = '#00529C', sublabel = '' }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = 2 * Math.PI * radius;
            const progress = Math.min(100, Math.max(0, value));
            const strokeDashoffset = circumference - (progress / 100) * circumference;

            return (
                <div className="relative inline-flex items-center justify-center flex-shrink-0" style={{ width: size, height: size }}>
                    <svg className="transform -rotate-90" width={size} height={size}>
                        <circle
                            cx={size / 2}
                            cy={size / 2}
                            r={radius}
                            stroke="#E2E8F0"
                            strokeWidth={strokeWidth}
                            fill="transparent"
                        />
                        <circle
                            cx={size / 2}
                            cy={size / 2}
                            r={radius}
                            stroke={color}
                            strokeWidth={strokeWidth}
                            strokeDasharray={circumference}
                            strokeDashoffset={strokeDashoffset}
                            strokeLinecap="round"
                            fill="transparent"
                            style={{ transition: 'stroke-dashoffset 0.8s ease-in-out' }}
                        />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="text-lg font-extrabold text-slate-800 leading-tight">
                            {value.toFixed(1)}<span className="text-[10px] font-semibold text-slate-500">%</span>
                        </span>
                        {sublabel && <span className="text-[8px] text-slate-400 font-bold uppercase tracking-wider">{sublabel}</span>}
                    </div>
                </div>
            );
        };

        // --- HORIZONTAL BAR ITEM COMPONENT ---
        const ScoreBar = ({ label, score, passGrade = 80, color = '#00529C' }) => {
            const isPass = score >= passGrade;
            const barColor = isPass ? color : '#EF4444';

            return (
                <div className="group mb-3">
                    <div className="flex justify-between items-center text-xs mb-1">
                        <span className="font-medium text-slate-700 truncate pr-2 group-hover:text-bri-blue transition-colors" title={label}>
                            {label}
                        </span>
                        <span className={`font-bold px-1.5 py-0.5 rounded text-[11px] flex-shrink-0 ${isPass ? 'text-slate-800 bg-slate-100' : 'text-red-700 bg-red-50'}`}>
                            {score.toFixed(1)}%
                        </span>
                    </div>
                    <div className="relative w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                        <div
                            className="h-full rounded-full transition-all duration-700 ease-out"
                            style={{ width: `${Math.min(100, Math.max(0, score))}%`, backgroundColor: barColor }}
                        />
                        <div 
                            className="absolute top-0 bottom-0 w-0.5 bg-slate-400 opacity-60 z-10"
                            style={{ left: `${passGrade}%` }}
                            title={`Target: ${passGrade}%`}
                        />
                    </div>
                </div>
            );
        };

        // --- EMPTY STATE / HERO UPLOADER COMPONENT ---
        const UploadHero = ({ onUploadSuccess, onLoadDatabaseCSV }) => {
            const [isDragging, setIsDragging] = useState(false);
            const [googleUrl, setGoogleUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const fileInputRef = useRef(null);

            const parseSingleFile = (file) => {
                return new Promise((resolve, reject) => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        try {
                            let parsed = [];
                            if (ext === 'csv') {
                                parsed = await parseSurveyCSV(evt.target.result);
                            } else {
                                const data = new Uint8Array(evt.target.result);
                                const workbook = XLSX.read(data, { type: 'array' });
                                const allRows = [];
                                for (const sheetName of workbook.SheetNames) {
                                    const sheet = workbook.Sheets[sheetName];
                                    const csvText = XLSX.utils.sheet_to_csv(sheet);
                                    const sheetParsed = await parseSurveyCSV(csvText);
                                    if (sheetParsed && sheetParsed.length > 0) allRows.push(...sheetParsed);
                                }
                                parsed = allRows;
                            }
                            if (!parsed || parsed.length === 0) {
                                reject(new Error(`File "${file.name}" tidak memiliki data valid.`));
                            } else {
                                resolve({ name: file.name, rows: parsed });
                            }
                        } catch (err) {
                            reject(new Error(`File "${file.name}": ${err.message}`));
                        }
                    };
                    reader.onerror = () => reject(new Error(`Gagal membaca file "${file.name}".`));
                    if (ext === 'csv') {
                        reader.readAsText(file);
                    } else {
                        reader.readAsArrayBuffer(file);
                    }
                });
            };

            const handleFiles = async (fileList) => {
                if (!fileList || fileList.length === 0) return;
                setLoading(true);
                setErrorMsg('');
                const allParsed = [];
                const fileNames = [];
                const errors = [];
                for (let i = 0; i < fileList.length; i++) {
                    try {
                        const result = await parseSingleFile(fileList[i]);
                        allParsed.push(...result.rows);
                        fileNames.push(`${result.name} (${result.rows.length} data)`);
                    } catch (err) {
                        errors.push(err.message);
                    }
                }
                setLoading(false);
                if (allParsed.length === 0) {
                    setErrorMsg(errors.length > 0 ? errors.join(' | ') : "Tidak ada data valid dari file yang dipilih.");
                    return;
                }
                const sourceLabel = fileList.length > 1
                    ? `${fileList.length} File (${allParsed.length} total data)`
                    : fileNames[0];
                onUploadSuccess(allParsed, sourceLabel);
                if (errors.length > 0) {
                    setErrorMsg(`Sebagian file gagal: ${errors.join(' | ')}`);
                }
            };

            const [typeformErr, setTypeformErr] = useState('');

            const handleTypeformSync = async () => {
                setLoading(true);
                setTypeformErr('');
                setErrorMsg('');
                try {
                    const cfgResp = await fetch('/api/typeform/config');
                    const cfg = await cfgResp.json();
                    if (!cfg.configured) {
                        throw new Error('Typeform belum dikonfigurasi di server. Isi token & daftar form di typeform.config.json.');
                    }

                    const dataResp = await fetch('/api/typeform/responses');
                    const data = await dataResp.json();
                    if (!dataResp.ok) throw new Error(data.error || 'Gagal mengambil data dari server.');

                    const allParsed = [];
                    for (const form of (data.forms || [])) {
                        if (!form.csv) continue;
                        let parsed;
                        try {
                            parsed = await parseSurveyCSV(form.csv);
                        } catch (e) {
                            console.warn(`Gagal parse ${form.label}:`, e && e.message);
                            parsed = [];
                        }
                        if (parsed && parsed.length > 0) allParsed.push(...parsed);
                    }

                    if (allParsed.length === 0) {
                        throw new Error('Belum ada respons valid pada form yang dikonfigurasi.');
                    }
                    onUploadSuccess(allParsed, `Typeform API - ${data.totalCount} data (${(data.forms || []).length} form)`);
                    setTypeformErr(data.errors && data.errors.length
                        ? `${data.errors.length} form gagal diambil (diabaikan).`
                        : '');
                } catch (err) {
                    setTypeformErr(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleGoogleSync = async () => {
                if (!googleUrl.trim()) {
                    setErrorMsg("Silakan masukkan URL Google Sheets CSV terlebih dahulu.");
                    return;
                }
                setLoading(true);
                setErrorMsg('');

                try {
                    let fetchUrl = googleUrl.trim();
                    if (fetchUrl.includes('docs.google.com/spreadsheets/d/')) {
                        const match = fetchUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                        if (match && match[1] && !fetchUrl.includes('output=csv') && !fetchUrl.includes('tqx=out:csv')) {
                            fetchUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:csv`;
                        }
                    }

                    const response = await fetch(fetchUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    const csvText = await response.text();
                    const parsed = await parseSurveyCSV(csvText);
                    
                    if (!parsed || parsed.length === 0) throw new Error("Data Google Sheets kosong.");
                    onUploadSuccess(parsed, "Google Sheets (Live Link)");
                } catch (err) {
                    setErrorMsg(`Gagal sinkronisasi Google Sheets: ${err.message}. Pastikan spreadsheet di-Publish to Web (CSV).`);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto py-12 px-4 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                        {/* Hero Header */}
                        <div className="bg-gradient-to-r from-bri-dark via-bri-blue to-[#004080] p-8 text-white text-center relative">
                            <div className="w-16 h-16 bg-white rounded-2xl shadow-lg flex items-center justify-center mx-auto mb-4 p-2 text-bri-blue">
                                <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                            </div>
                            <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Upload Data Survei Anda</h2>
                            <p className="text-blue-100 text-sm mt-2 max-w-xl mx-auto">
                                Dashboard ini 100% menggunakan data survei yang Anda unggah sendiri (hasil export Typeform / Google Forms). Tidak ada data dummy.
                            </p>
                        </div>

                        {/* Upload Actions */}
                        <div className="p-8 space-y-8">
                            {errorMsg && (
                                <div className="p-4 bg-rose-50 text-rose-800 border border-rose-200 rounded-2xl text-sm font-medium flex items-center gap-3">
                                    <span>⚠️</span> {errorMsg}
                                </div>
                            )}

                            {/* Drag & Drop Zone */}
                            <div
                                onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                                onDragLeave={() => setIsDragging(false)}
                                onDrop={(e) => {
                                    e.preventDefault();
                                    setIsDragging(false);
                                    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                                        handleFiles(e.dataTransfer.files);
                                    }
                                }}
                                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                className={`border-2 border-dashed rounded-3xl p-10 text-center cursor-pointer transition-all duration-200 flex flex-col items-center justify-center ${
                                    isDragging ? 'border-bri-blue bg-blue-50/70 scale-[1.01]' : 'border-slate-300 hover:border-bri-blue bg-slate-50/70 hover:bg-blue-50/30'
                                }`}
                            >
                                <div className="w-16 h-16 bg-white shadow-sm border border-slate-200 rounded-2xl flex items-center justify-center text-bri-blue mb-4">
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                                </div>
                                <h3 className="text-lg font-bold text-slate-800">
                                    {loading ? 'Sedang Memproses File...' : 'Tarik & Letakkan File CSV / Excel ke Sini'}
                                </h3>
                                <p className="text-xs text-slate-500 mt-1 max-w-md">
                                    Bisa pilih <strong>beberapa file sekaligus</strong> (per kategori). Mendukung export dari <strong>Typeform (.csv)</strong> atau <strong>Excel (.xlsx)</strong>
                                </p>
                                <button
                                    type="button"
                                    disabled={loading}
                                    className="mt-5 px-6 py-2.5 bg-bri-blue hover:bg-bri-dark text-white rounded-xl font-bold text-sm shadow-md transition-all disabled:opacity-50"
                                >
                                    Pilih File dari Komputer
                                </button>
                                <input
                                    type="file"
                                    ref={fileInputRef}
                                    onChange={(e) => e.target.files && handleFiles(e.target.files)}
                                    accept=".csv, .xlsx, .xls"
                                    multiple
                                    className="hidden"
                                />
                            </div>

                            {/* Google Sheet Live Link & Quick Load */}
                            <div className="space-y-3 pt-4 border-t border-slate-100">
                                <div className="p-4 rounded-2xl bg-blue-50 border border-bri-blue/30">
                                    <div className="flex flex-col sm:flex-row sm:items-center gap-3">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 text-bri-blue font-bold text-sm mb-1">
                                                <span>⚡</span> Ambil Data Langsung dari Typeform (API)
                                            </div>
                                            <p className="text-xs text-slate-500">
                                                Tarik semua respons survei secara otomatis dari Typeform. Tidak perlu unduh CSV/Excel lagi.
                                                Dibutuhkan <strong>Typeform Personal Access Token</strong> yang tersimpan aman di server.
                                            </p>
                                        </div>
                                        <button
                                            onClick={handleTypeformSync}
                                            disabled={loading}
                                            className="shrink-0 bg-bri-blue hover:bg-bri-dark text-white font-bold py-2.5 px-5 rounded-xl text-xs transition-colors disabled:opacity-50"
                                        >
                                            {loading ? 'Mengambil...' : 'Ambil Data Typeform'}
                                        </button>
                                    </div>
                                    {typeformErr && (
                                        <div className="mt-3 p-3 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-xs font-medium">
                                            ⚠️ {typeformErr}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Google Sheet Live Link & Quick Load */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-100">
                                {/* Option A: Google Sheets Link */}
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-center gap-2 text-emerald-700 font-bold text-sm mb-1">
                                            <span>📊</span> Hubungkan Google Sheet (Live Link)
                                        </div>
                                        <p className="text-xs text-slate-500 mb-3">
                                            Masukkan link Google Sheets yang telah di <em>Publish to Web (CSV)</em>.
                                        </p>
                                        <input
                                            type="url"
                                            value={googleUrl}
                                            onChange={e => setGoogleUrl(e.target.value)}
                                            placeholder="https://docs.google.com/spreadsheets/.../pub?output=csv"
                                            className="w-full text-xs p-2.5 bg-white border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 mb-3"
                                        />
                                    </div>
                                    <button
                                        onClick={handleGoogleSync}
                                        disabled={loading}
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-colors disabled:opacity-50"
                                    >
                                        Sinkronkan Google Sheets
                                    </button>
                                </div>

                                {/* Option B: Load from Database folder */}
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-center gap-2 text-bri-blue font-bold text-sm mb-1">
                                            <span>📂</span> Muat File dari Folder Database
                                        </div>
                                        <p className="text-xs text-slate-500 mb-4">
                                            Terdapat file respon CSV di folder <code>Database/responses-t2RvUWep-...csv</code>. Anda dapat langsung menggunakannya.
                                        </p>
                                    </div>
                                    <button
                                        onClick={onLoadDatabaseCSV}
                                        disabled={loading}
                                        className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-colors disabled:opacity-50"
                                    >
                                        Gunakan File CSV Database
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const APP_DATA_VERSION = 'v1.4.0';

        const App = () => {
            // Load saved user data from localStorage, auto-clearing outdated cache
            const [surveyData, setSurveyData] = useState(() => {
                try {
                    const storedVersion = localStorage.getItem('bri_survey_data_version');
                    if (storedVersion !== APP_DATA_VERSION) {
                        localStorage.removeItem('bri_user_uploaded_survey_data');
                        localStorage.setItem('bri_survey_data_version', APP_DATA_VERSION);
                        return [];
                    }
                    const saved = localStorage.getItem('bri_user_uploaded_survey_data');
                    if (saved) {
                        return JSON.parse(saved);
                    }
                } catch (e) {
                    try { localStorage.removeItem('bri_user_uploaded_survey_data'); } catch (_) {}
                }
                return [];
            });

            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('bri_user_survey_config');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) {}
                }
                return {
                    campusName: 'Regional Campus',
                    passGrade: 80,
                    formUrl: 'https://form.typeform.com/to/t2RvUWep',
                    dataSourceName: 'Belum ada data',
                    lastSync: '-'
                };
            });

            const [filters, setFilters] = useState({
                campus: 'All',
                program: 'All',
                batch: 'All',
                dateRange: 'All'
            });

            const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'pillars', 'ranking', 'feedback', 'raw'
            const [feedbackCategoryFilter, setFeedbackCategoryFilter] = useState('All');
            const [feedbackSearch, setFeedbackSearch] = useState('');
            const [fbPage, setFbPage] = useState(1);
            const [fbPageSize, setFbPageSize] = useState(100);
            const [rawPage, setRawPage] = useState(1);
            const [rawPageSize, setRawPageSize] = useState(100);
            const fileInputReplaceRef = useRef(null);

            // Save to localStorage whenever user data changes (wrapped to handle quota limits)
            useEffect(() => {
                try {
                    localStorage.setItem('bri_user_uploaded_survey_data', JSON.stringify(surveyData));
                } catch (e) {
                    console.warn('localStorage full - data kept in memory only for this session.');
                }
            }, [surveyData]);

            useEffect(() => {
                try {
                    localStorage.setItem('bri_user_survey_config', JSON.stringify(config));
                } catch (e) {
                    console.warn('localStorage full for config.');
                }
            }, [config]);

            const analytics = useSurveyAnalytics(surveyData, filters, config.passGrade);

            const distinctCampuses = useMemo(() => ['All', ...new Set(surveyData.map(d => d.campus).filter(Boolean))], [surveyData]);
            const distinctPrograms = useMemo(() => ['All', ...new Set(surveyData.map(d => d.program).filter(Boolean))], [surveyData]);
            const distinctBatches = useMemo(() => ['All', ...new Set(surveyData.map(d => d.batch).filter(Boolean))], [surveyData]);

            // Handle new upload
            const handleUploadSuccess = (parsedData, sourceName) => {
                setSurveyData(parsedData);
                setConfig(prev => ({
                    ...prev,
                    dataSourceName: sourceName,
                    lastSync: new Date().toLocaleTimeString('id-ID')
                }));
            };

            // Quick load CSV from Database folder
            const handleLoadDatabaseCSV = async () => {
                try {
